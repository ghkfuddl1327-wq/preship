[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preship"
version = "0.1.3"
description = "A pre-launch reliability check for FastAPI — find the 500s and contract breaks before your users do, with a copy-paste AI fix prompt for each. Not a security scanner. No API key needed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BUSL-1.1" }
authors = [{ name = "Preship" }]
keywords = ["fastapi", "testing", "fuzzing", "openapi", "api", "preflight"]
# The only CLI runtime dependency is schemathesis (core drives the schemathesis console script
# in the same venv as a subprocess). fastapi/uvicorn etc. stay in requirements.txt for the demo target.
dependencies = ["schemathesis==4.20.3", "anthropic==0.105.2"]

[project.urls]
Repository = "https://github.com/ghkfuddl1327-wq/preship"
Homepage = "https://github.com/ghkfuddl1327-wq/preship"

[project.scripts]
preship = "ohs_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
